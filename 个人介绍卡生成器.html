<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XY的个人介绍模板工具</title>
<style>
  :root{
    --bg:#0d0d12; --panel:#16161f; --panel-2:#1d1d28; --line:#2a2a38;
    --text:#ece9e3; --dim:#9a96a8; --accent:#ff9d5c; --accent-2:#ffd0a8;
    --radius:16px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5;
    padding:24px 18px 60px;
  }
  header{ max-width:1080px; margin:0 auto 22px; }
  header h1{ font-size:24px; letter-spacing:1px; }
  header p{ color:var(--dim); margin-top:6px; font-size:14px; }
  header .tag{
    display:inline-block; font-size:12px; color:var(--accent-2);
    border:1px solid var(--line); padding:3px 10px; border-radius:999px; margin-bottom:10px;
  }
  .wrap{ max-width:1080px; margin:0 auto; display:flex; gap:20px; align-items:flex-start; }
  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; flex:1 1 0; min-width:0;
  }
  .panel.preview{ position:sticky; top:16px; }
  .modebar{ display:flex; gap:8px; margin-bottom:18px; }
  .modebar button{
    flex:1; padding:11px 0; border-radius:12px; cursor:pointer; font-size:14px;
    background:var(--panel-2); color:var(--dim); border:1px solid var(--line); transition:.2s;
  }
  .modebar button.active{ background:linear-gradient(160deg,var(--accent),#ff7e3f); color:#1a0f06; border-color:transparent; font-weight:700; }
  .field{ margin-bottom:15px; }
  .field label{ display:block; font-size:13px; color:var(--dim); margin-bottom:6px; }
  .field .hint{ font-size:11px; color:#6f6b7e; margin-top:4px; }
  /* Phase 1: 输入错误状态 */
  .field .input-error{ border-color: #ff6b6b !important; }
  .field .error-msg{ font-size:11px; color: #ff6b6b; margin-top:4px; display: none; }
  .field.invalid .error-msg{ display: block; }
  input[type=text], textarea, select{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); font-size:14px; font-family:inherit; outline:none;
  }
  input[type=text]:focus, textarea:focus, select:focus{ border-color:var(--accent); }
  /* Phase 1: 可见焦点指示器（替代 outline:none） */
  :focus-visible { outline: 2px solid var(--accent, #ff9d5c); outline-offset: 2px; }
  @media (pointer: fine) { :focus:not(:focus-visible) { outline: none; } }
  textarea{ resize:vertical; min-height:54px; }
  .row{ display:flex; gap:10px; }
  .row > *{ flex:1; }
  .theme-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .industry-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .industry-row .btn{ padding:7px 14px; font-size:12px; flex:0 0 auto; }
  .theme-label{ display:block; width:100%; font-size:11px; color:var(--dim); margin-top:6px; letter-spacing:1px; text-transform:uppercase; }
  .swatch{
    width:30px; height:30px; border-radius:50%; cursor:pointer; border:2px solid transparent;
    display:inline-flex; align-items:center; justify-content:center; font-size:11px; color:#1a0f06;
  }
  .swatch.active{ border-color:#fff; }
  .avatar-row{ display:flex; align-items:center; gap:12px; }
  .avatar-row img{ width:54px; height:54px; border-radius:50%; object-fit:cover; border:1px solid var(--line); background:#222; }
  .btn{
    padding:9px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel-2);
    color:var(--text); cursor:pointer; font-size:13px; font-family:inherit;
  }
  .btn:hover{ border-color:var(--accent); }
  .btn.primary{ background:linear-gradient(160deg,var(--accent),#ff7e3f); color:#1a0f06; border:none; font-weight:700; }
  .actions{ display:flex; gap:10px; margin-top:14px; }
  .actions .btn{ flex:1; padding:12px 0; font-size:15px; }
  .phone{
    width:100%; height:74vh; min-height:520px; border-radius:28px; overflow:hidden;
    border:1px solid var(--line); background:#06060b;
  }
  .phone iframe{ width:100%; height:100%; border:0; }
  .preview-tip{ text-align:center; color:var(--dim); font-size:12px; margin-top:10px; }
  @media (max-width:860px){ .wrap{ flex-direction:column; } .panel.preview{ position:static; width:100%; } .phone{ height:600px; } }
</style>
</head>
<body>
<header>
  <span class="tag">通用成员名片 · 以 XY俱乐部 为例</span>
  <h1>XY的个人介绍模板工具</h1>
  <p>左边填内容，右边实时预览。支持两种风格切换：「人设卡」（名字·年龄·星座·技能，适合俱乐部成员/陪玩官）和「通用名片」（姓名·头衔·简介·联系方式）。默认用 XY俱乐部 作为演示案例，你把它换成任何俱乐部/团队都行。填好点「下载这张卡片」，得到一份不联网也能打开的独立网页，可发给任何人。</p>
</header>

<div class="wrap">
  <!-- ============ 表单 ============ -->
  <section class="panel">
    <div class="modebar">
      <button id="modeOc" class="active" data-mode="oc" aria-pressed="true" aria-controls="fieldsOc">人设卡</button>
      <button id="modeGeneral" data-mode="general" aria-pressed="false" aria-controls="fieldsGeneral">通用名片</button>
    </div>

    <!-- 人设卡字段 -->
    <div id="fieldsOc">
      <div class="field">
        <label>俱乐部 / 主标题</label>
        <input type="text" id="clubName" value="XY俱乐部">
      </div>
      <div class="field">
        <label>英文标语（花体英文那行）</label>
        <input type="text" id="tagline" value="where interesting people gather">
      </div>
      <div class="row">
        <div class="field">
          <label>名字</label>
          <input type="text" id="name" value="小鱼">
        </div>
        <div class="field" style="max-width:90px">
          <label>年龄</label>
          <input type="text" id="age" value="21">
        </div>
      </div>
      <div class="field">
        <label>星座</label>
        <select id="zodiac"></select>
      </div>
      <div class="field">
        <label>技能（用逗号分隔，可多可少）</label>
        <input type="text" id="skills" value="文字陪聊，情感树洞，受气包">
        <div class="hint">例如：文字陪聊，情感树洞，受气包</div>
      </div>
    </div>

    <!-- 通用名片字段 -->
    <div id="fieldsGeneral" style="display:none">
      <!-- Phase 4: 行业预设 -->
      <div class="field">
        <label>行业预设 <span style="font-weight:normal;font-size:11px;color:var(--dim)">（一键填入中性演示数据，点击后仍可手动修改）</span></label>
        <div class="industry-row" id="industryRow">
          <button class="btn" data-industry="reading" type="button">📖 读书会</button>
          <button class="btn" data-industry="restaurant" type="button">🍽 本地餐企</button>
          <button class="btn" data-industry="business" type="button">🏢 小型企业</button>
        </div>
      </div>
      <div class="field">
        <label>姓名 / 主标题</label>
        <input type="text" id="fullName" value="你的名字">
      </div>
      <div class="field">
        <label>头衔 / 身份（花体英文那行）</label>
        <input type="text" id="titleRole" value="一句话身份，如：自由摄影师">
      </div>
      <div class="field">
        <label>一句话简介</label>
        <textarea id="bio">用光影记录平凡日子里的温柔瞬间。</textarea>
      </div>
      <div class="field">
        <label>联系方式 / 标签（用逗号分隔）</label>
        <input type="text" id="contact" value="微信：yourid，邮箱：you@mail.com">
      </div>
    </div>

    <!-- 两种模式共用 -->
    <div class="field">
      <label>签名 · 中文</label>
      <input type="text" id="signCn" value="一半烟火以谋生，一半诗意以谋爱">
    </div>
    <div class="field">
      <label>签名 · 英文（可留空）</label>
      <input type="text" id="signEn" value="Half for the warmth of daily life to make a living, half for poetry to seek love.">
    </div>

    <!-- Footer 自定义设置 -->
    <div class="field">
      <label>卡片底部版权行</label>
      <select id="footMode">
        <option value="default">默认：© 俱乐部名 · 人名</option>
        <option value="produce">俱乐部出品 · 人名专属</option>
        <option value="custom">自定义文案</option>
        <option value="hidden">隐藏（不显示）</option>
      </select>
      <input type="text" id="footCustom" placeholder="输入自定义文案..." style="margin-top:8px;display:none" maxlength="50">
    </div>

    <div class="field">
      <label>头像</label>
      <div class="avatar-row">
        <img id="avatarThumb" alt="头像预览">
        <input type="file" id="avatar" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;">
        <button class="btn" id="avatarBtn">选择图片</button>
        <button class="btn" id="avatarClear">清除</button>
      </div>
      <div class="hint">建议正方形图片，会自动裁成圆形。不传则用主题色首字占位。</div>
    </div>

    <div class="field">
      <label>主题色</label>
      <div class="theme-row" id="themeRow"></div>
      <div class="theme-row" style="margin-top:10px">
        <input type="color" id="customColor" value="#ff9d5c" style="width:44px;height:34px;padding:2px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2)">
        <span style="font-size:12px;color:var(--dim)">自定义颜色</span>
      </div>
    </div>
  </section>

  <!-- ============ 预览 ============ -->
  <section class="panel preview">
    <div class="phone"><iframe id="preview" sandbox="allow-scripts allow-same-origin" title="卡片预览（实时显示您编辑的名片效果）" aria-label="卡片预览区域"></iframe></div>
    <div class="preview-tip">↑ 这是卡片在手机上的样子（实时更新）</div>
    <div class="actions">
      <button class="btn primary" id="download">下载这张卡片</button>
      <button class="btn" id="reset">重置</button>
    </div>
  </section>
</div>

<script>
/* =========================================================================
   XY的个人介绍模板工具
   - 玻璃拟态（液态玻璃）视觉与性能优化，主题色对齐 XY俱乐部 官网四套主题
   - 内容抽成配置，支持「人设卡 / 通用名片」两种字段（可切换）
   - 主题色、头像可换；右侧实时预览；一键下载独立 HTML
   ========================================================================= */

/* ---------- 卡片 CSS（与导出共用，单一样本来源） ---------- */
const CARD_CSS = `
  :root{
    --bg:#06060b;
    --glass-1:rgba(255,255,255,0.13);
    --glass-2:rgba(255,255,255,0.045);
    --line:rgba(255,255,255,0.17);
    --amber:#ff9d5c;
    --amber-2:#ffd0a8;
    --text:#f6f3ee;
    --dim:rgba(246,243,238,0.56);
    --cn:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
    --en:"Snell Roundhand","Apple Chancery","Brush Script MT","Segoe Script","Comic Sans MS",cursive;
    --blur:26px;
    --card-w:420px;
    --blob1:rgba(255,138,76,.48);
    --blob2:rgba(96,120,255,.38);
    --blob3:rgba(188,90,224,.30);
    --name-gradient-start:#ffffff;
    --name-shine-color:rgba(255,255,255,0.95);
    /* Phase 4: 商务主题扩展变量（暗色默认 = 现有硬编码值，light 主题由 themeVars 覆盖） */
    --bg-solid:#06060b;
    --bg-grad-top:#171425;
    --card-shadow-1:rgba(0,0,0,0.78);
    --card-shadow-2:rgba(0,0,0,0.42);
    --card-highlight:rgba(255,255,255,0.20);
    --card-edge:rgba(255,255,255,0.35);
    --card-border-inset-1:rgba(255,255,255,0.40);
    --card-border-inset-2:rgba(255,255,255,0.05);
    --chip-bg:rgba(255,255,255,0.05);
    --chip-line:rgba(255,255,255,0.12);
    --pill-bg1:rgba(255,255,255,0.12);
    --pill-bg2:rgba(255,255,255,0.04);
    --pill-border:rgba(255,255,255,0.18);
    --pill-inset:rgba(255,255,255,0.25);
    --sign-color:#fffaf3;
    --foot-color:rgba(246,243,238,0.3);
    --text-selection:#fff;
    --fallback-bg1:rgba(30,28,40,0.95);
    --fallback-bg2:rgba(14,13,20,0.97);
    --avatar-rect:#0b0a12;
    --avatar-border:rgba(255,255,255,0.25);
    --avatar-shadow:rgba(0,0,0,0.45);
    --avatar-gradient-stop3:#6a4630;
    --name-shine-stop:rgba(255,255,255,0.95);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  ::selection{ background:rgba(var(--amber-rgb),0.38); color:var(--text-selection); }
  ::-moz-selection{ background:rgba(var(--amber-rgb),0.38); color:var(--text-selection); }

  body{
    min-height:100vh; min-height:100dvh;
    font-family:var(--cn); color:var(--text); background:var(--bg-solid);
    background:radial-gradient(120% 90% at 50% -10%, var(--bg-grad-top) 0%, var(--bg-solid) 58%) fixed;
    overflow-x:hidden;
    -webkit-text-size-adjust:100%; text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    position:relative; width:100%; min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    padding:24px 16px;
    padding-top:calc(24px + env(safe-area-inset-top, 0px));
    padding-right:calc(16px + env(safe-area-inset-right, 0px));
    padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px));
    padding-left:calc(16px + env(safe-area-inset-left, 0px));
  }

  .grain{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    opacity:0.035; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .blob{
    position:fixed; border-radius:50%; z-index:0; pointer-events:none;
    animation:drift 22s ease-in-out infinite; will-change:transform;
  }
  .blob.b1{ width:560px;height:560px; background:radial-gradient(circle, var(--blob1) 0%, rgba(255,138,76,0) 70%); top:-160px; left:-140px; }
  .blob.b2{ width:520px;height:520px; background:radial-gradient(circle, var(--blob2) 0%, rgba(96,120,255,0) 70%); bottom:-180px; right:-140px; animation-delay:-7s; }
  .blob.b3{ width:440px;height:440px; background:radial-gradient(circle, var(--blob3) 0%, rgba(188,90,224,0) 70%); top:36%; left:52%; animation-delay:-12s; }
  @keyframes drift{
    0%,100%{ transform:translate(0,0) scale(1); }
    33%{ transform:translate(34px,-26px) scale(1.06); }
    66%{ transform:translate(-24px,20px) scale(0.95); }
  }

  .card{
    position:relative; z-index:1; width:100%; max-width:var(--card-w);
    padding:40px 30px 34px; border-radius:32px; text-align:center; transition:transform .35s ease;
  }
  .card::before{
    content:""; position:absolute; inset:0; z-index:1; border-radius:inherit;
    background:radial-gradient(70% 50% at var(--mx,50%) var(--my,0%),
      var(--card-highlight), rgba(255,255,255,0) 62%);
    pointer-events:none;
  }
  .card::after{
    content:""; position:absolute; left:8%; right:8%; bottom:-2px; height:1px; z-index:1;
    background:linear-gradient(90deg, transparent, var(--card-edge), transparent);
    pointer-events:none;
  }
  .card > *{ position:relative; z-index:2; }

  .card-bg{
    position:absolute; inset:0; z-index:0; border-radius:inherit;
    background:linear-gradient(160deg, var(--glass-1), var(--glass-2));
    border:1px solid var(--line);
    -webkit-backdrop-filter:blur(var(--blur)) saturate(170%);
    backdrop-filter:blur(var(--blur)) saturate(170%);
    box-shadow:
      0 30px 70px -25px rgba(0,0,0,0.78),
      0 4px 14px rgba(0,0,0,0.42),
      inset 0 1px 1px rgba(255,255,255,0.40),
      inset 0 -1px 1px rgba(255,255,255,0.05);
    pointer-events:none; transition:box-shadow .35s ease;
  }

  .avatar-wrap{ position:relative; z-index:2; width:138px; height:138px; margin:0 auto 20px; border-radius:50%; }
  .avatar-wrap::after{ content:""; position:absolute; inset:-14px; border-radius:50%; z-index:0;
    background:radial-gradient(circle, rgba(var(--amber-rgb),.34), transparent 70%); }
  .avatar-ring{
    position:absolute; inset:-7px; border-radius:50%; z-index:3;
    border:2px solid rgba(var(--amber-2-rgb),0.55); box-shadow:0 0 14px rgba(var(--amber-rgb),0.25);
    animation:breathe 4.6s ease-in-out infinite;
  }
  @keyframes breathe{ 0%,100%{ transform:scale(1); opacity:.55; } 50%{ transform:scale(1.06); opacity:1; } }
  .avatar{
    position:relative; z-index:2; width:100%; height:100%; border-radius:50%; object-fit:cover; display:block;
    background:radial-gradient(circle at 50% 32%, var(--amber-2) 0%, var(--amber) 42%, var(--avatar-gradient-stop3) 100%);
    border:1px solid var(--avatar-border); box-shadow:0 10px 26px var(--avatar-shadow);
    transform:translateZ(0); backface-visibility:hidden; -webkit-backface-visibility:hidden;
    animation:floaty 6.8s ease-in-out infinite;
  }
  @keyframes floaty{ 0%,100%{ transform:translate3d(0,0,0); } 50%{ transform:translate3d(0,-6px,0); } }

  .club-name{
    position:relative; font-size:32px; font-size:clamp(24px, 7.2vw, 34px);
    font-weight:700; letter-spacing:3px; line-height:1.25;
    background:linear-gradient(180deg, var(--name-gradient-start), var(--amber-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 10px rgba(var(--amber-rgb),0.35));
  }
  .club-name::after{
    content:attr(data-text); position:absolute; left:0; top:0; width:100%;
    background:linear-gradient(100deg, transparent 40%, var(--name-shine-color) 50%, transparent 60%);
    background-size:260% 100%; background-repeat:no-repeat;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shine 6.5s ease-in-out infinite; pointer-events:none;
  }
  @keyframes shine{ 0%, 40%{ background-position:-130% 0; } 72%, 100%{ background-position:230% 0; } }
  .script{
    font-family:var(--en); font-size:23px; font-size:clamp(16px, 5.0vw, 24px);
    line-height:1.45; color:var(--amber-2); margin-top:2px; letter-spacing:.5px;
  }

  .divider{ width:64px; height:1px; margin:22px auto; background:linear-gradient(90deg, transparent, rgba(var(--amber-2-rgb),.9), transparent); position:relative; }
  .divider::after{ content:""; position:absolute; top:-1.5px; left:50%; transform:translateX(-50%); width:5px; height:4px; border-radius:50%; background:var(--amber-2); box-shadow:0 0 10px 2px rgba(var(--amber-2-rgb),.7); }

  .info{ font-size:17px; font-size:clamp(15px, 4.3vw, 18px); letter-spacing:3px; color:var(--text); }
  .info .dot{ color:var(--amber); margin:0 8px; }
  .info .age{ color:var(--amber-2); }
  .info .zodiac{
    display:inline-block; margin-left:5px; letter-spacing:0;
    font-family:"Apple Symbols","Segoe UI Symbol","Noto Sans Symbols","Noto Sans Symbols2","Symbola",serif;
    font-size:1.12em; color:var(--amber-2);
    text-shadow:0 0 10px rgba(var(--amber-2-rgb),0.45); animation:zodiacGlow 4.2s ease-in-out infinite;
  }
  @keyframes zodiacGlow{ 0%,100%{ opacity:.72; } 50%{ opacity:1; } }

  .label{
    display:inline-block; font-size:11px; font-size:clamp(9px, 2.9vw, 11px); letter-spacing:5px; color:var(--dim);
    padding:5px 14px; margin:24px 0 13px; border-radius:999px;
    background:var(--chip-bg); border:1px solid var(--chip-line);
  }

  .skills{ display:flex; flex-wrap:wrap; justify-content:center; margin:0 -5px; }
  .skill{
    position:relative; isolation:isolate; margin:0 5px 10px; padding:10px 16px; border-radius:16px;
    font-size:14px; font-size:clamp(12px, 3.7vw, 15px); letter-spacing:1px; color:var(--text);
    background:linear-gradient(150deg, var(--pill-bg1), var(--pill-bg2));
    border:1px solid var(--pill-border); box-shadow:inset 0 1px 1px var(--pill-inset);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    transition:transform .22s cubic-bezier(.34,1.56,.64,1), background .25s ease;

  } catch(e) {}

  });

/* ============================================================
   SECTION 6: 渲染逻辑（纯函数，无副作用）
   职责：主题色计算、卡片 DOM 生成、导出 HTML 组装
   ============================================================ */
function themeInfo(theme){
  const t = theme || AppState.theme;
  const a = t.a, b = t.b, h = getHue(a);
  const isLight = t.mode === 'light';
  const blobs = isLight ? [
    'rgba('+hslToRgb(h,45,55).join(',')+',0.14)',
    'rgba('+hslToRgb((h+38)%360,40,52).join(',')+',0.09)',
    'rgba('+hslToRgb((h+330)%360,35,55).join(',')+',0.07)'
  ] : [
    'rgba('+hslToRgb(h,85,62).join(',')+',.45)',
    'rgba('+hslToRgb((h+38)%360,80,60).join(',')+',.30)',
    'rgba('+hslToRgb((h+330)%360,75,62).join(',')+',.26)'
  ];
  return {a:a, b:b, blobs:blobs};
}

/* Phase 4: 生成完整 :root 变量字符串（暗色主题 = 默认值，light 主题注入 palette 覆盖） */
function getThemeVarValues(theme){
  const t = theme || AppState.theme;
  const {a,b,blobs} = themeInfo(t);
  var v = {
    '--amber':a,'--amber-2':b,
    '--amber-rgb':hexToRgb(a).join(','),'--amber-2-rgb':hexToRgb(b).join(','),
    '--blob1':blobs[0],'--blob2':blobs[1],'--blob3':blobs[2]
  };
  if (t.mode === 'light' && t.palette) {
    var p = t.palette;
    v['--bg-solid']=p.bg; v['--bg-grad-top']=p.bg;
    v['--text']=p.text; v['--dim']=p.dim;
    v['--glass-1']=p.glass1; v['--glass-2']=p.glass2; v['--line']=p.line;
    v['--card-shadow-1']=p.shadow1; v['--card-shadow-2']=p.shadow2;
    v['--card-highlight']=p.highlight; v['--card-edge']=p.edge;
    v['--card-border-inset-1']=p.borderInset1; v['--card-border-inset-2']=p.borderInset2;
    v['--chip-bg']=p.chipBg; v['--chip-line']=p.chipLine;
    v['--pill-bg1']=p.pillBg1; v['--pill-bg2']=p.pillBg2;
    v['--pill-border']=p.pillBorder; v['--pill-inset']=p.pillInset;
    v['--sign-color']=p.signColor; v['--foot-color']=p.footColor;
    v['--text-selection']=p.selectionFg;
    v['--fallback-bg1']=p.fallbackBg1; v['--fallback-bg2']=p.fallbackBg2;
    v['--avatar-rect']=p.avatarRect; v['--avatar-border']=p.avatarBorder;
    v['--avatar-shadow']=p.avatarShadow; v['--avatar-gradient-stop3']=p.avatarGradStop3;
    v['--name-gradient-start']=p.nameGradientStart;
    v['--name-shine-color']=p.nameShineStop;
  }
  return v;
}
function getRootVarString(theme){
  var v = getThemeVarValues(theme);
  return ':root{'+Object.keys(v).map(function(k){return k+':'+v[k];}).join(';')+';}';
}

function readCfg(){

    c.zodiac = val('zodiac');

    c.signCn = (val('signCn')||'').trim().slice(0,50); c.signEn = (val('signEn')||'').trim().slice(0,50);
  } else {
    c.title = (val('fullName')||'姓名').trim().slice(0,50);
    c.script = (val('titleRole')||'').trim().slice(0,80);

function buildDoc(c, opts){
  const theme = c.theme || AppState.theme;

  const sub = c.mode==='oc' ? (c.name||'') : (c.script||'');

/* ============================================================
   SECTION 8: 本地持久化（Phase 1）
   职责：自动保存/恢复表单状态，防止刷新丢失
   ============================================================ */
var STORAGE_KEY = 'xy-intro-card-state-v1';
var STORAGE_VERSION = 'v1'; // 版本号，用于迁移检测

function saveState() {
  try {
    var state = {
      v: STORAGE_VERSION,
      mode: AppState.mode,
      theme: AppState.theme,
      fields: {}
    };
    document.querySelectorAll('input, textarea, select').forEach(function(el) {
      if (el.id) state.fields[el.id] = el.value;
    });
    // 头像不保存（dataURL 太大）
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) { /* quota exceeded，静默处理 */ }
}

function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    var state = JSON.parse(raw);

    // Phase 4: 版本迁移检测（兼容旧版无 mode/palette 的 state）
    if (state.v && state.v !== STORAGE_VERSION) {
      // 未来版本迁移逻辑在此扩展
      console.warn('[xy-intro-card] 检测到旧版本存储，正在迁移...');
    }
    // 确保 theme 有 mode 和 palette 字段（兼容旧数据）
    if (state.theme && !state.theme.mode) {
      state.theme.mode = 'dark';
      state.theme.palette = null;
    }

    // 恢复模式
    if (state.mode) setMode(state.mode);
    // 恢复主题
    if (state.theme) {
      AppState.theme = Object.assign({mode:'dark', palette:null}, state.theme);
      document.getElementById('customColor').value = state.theme.a;
    }
    // 恢复字段
    if (state.fields) {
      Object.keys(state.fields).forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.value = state.fields[id];
      });
    }
    return true;
  } catch(e) { return false; }
}

/* ============================================================

   职责：实时验证输入，显示错误提示
   ============================================================ */
function addInputFeedback(el, validator, errorMsg) {
  el.addEventListener('input', function() {
    var valid = validator(this.value);
    this.classList.toggle('input-error', !valid);
    var field = this.closest('.field');
    if (field) field.classList.toggle('invalid', !valid);
    var hint = this.parentElement.querySelector('.hint');
    if (hint) {
      hint.textContent = valid ? '' : (errorMsg || '输入无效');
      hint.style.color = valid ? '' : '#ff6b6b';
    }
  });
}

function setMode(mode){
  AppState.mode = mode;
  document.getElementById('modeOc').classList.toggle('active', mode==='oc');
  document.getElementById('modeGeneral').classList.toggle('active', mode==='general');
  document.getElementById('fieldsOc').style.display = mode==='oc' ? '' : 'none';
  document.getElementById('fieldsGeneral').style.display = mode==='general' ? '' : 'none';
  scheduleUpdate();
}

function buildThemeSwatches(){
  const row = document.getElementById('themeRow');
  // 分组：dark 先，light 后（商务主题家族），中间加分隔标题
  var groups = {dark:[], light:[]};
  THEMES.forEach(function(t){ groups[t.mode||'dark'].push(t); });
  function renderGroup(themes, label, container){
    if (label && container) {
      var lbl = document.createElement('span');
      lbl.className = 'theme-label';
      lbl.textContent = label;
      container.appendChild(lbl);
    }
    themes.forEach(function(t){
      const s = document.createElement('div');
      const key = t.key || t.a.toLowerCase(); // 用 key 或色值作为唯一标识
      s.className = 'swatch' + (key === (AppState.theme.key || AppState.theme.a.toLowerCase()) ? ' active':'');
      s.style.background = 'linear-gradient(160deg,'+t.b+','+t.a+')';
      s.title = t.name + (t.desc ? ' · '+t.desc : '');
      s.textContent = t.name.charAt(0);
      s.addEventListener('click', function(){
        AppState.theme = {a:t.a, b:t.b, mode:t.mode, palette:t.palette};
        document.getElementById('customColor').value = t.a;
        document.querySelectorAll('#themeRow .swatch').forEach(function(x){x.classList.remove('active');});
        s.classList.add('active');
        scheduleUpdate();
      });
      container.appendChild(s);
    });
  }
  // 给每个主题分配唯一 key（避免色值相同时误判）
  THEMES.forEach(function(t, i){
    if (!t.key) t.key = Object.keys(THEMES_CONFIG)[i];
  });
  row.innerHTML = '';
  renderGroup(groups.dark, '液态玻璃', row);
  renderGroup(groups.light, '商务中性', row);
}

/* ============================================================
   SECTION 10: 交互绑定（DOM 事件注册）
   职责：初始化所有 UI 交互，启动应用
   ============================================================ */
function setup(){
  // 恢复本地状态
  var restored = loadState();

  // 星座下拉
  const z = document.getElementById('zodiac');
  Object.keys(ZODIAC).forEach(function(k){ const o=document.createElement('option'); o.value=k; o.textContent=k; if(k==='巨蟹座')o.selected=true; z.appendChild(o); });

  buildThemeSwatches();

  // 模式切换
  document.getElementById('modeOc').addEventListener('click', function(){ setMode('oc'); });
  document.getElementById('modeGeneral').addEventListener('click', function(){ setMode('general'); });
  // Phase 1: 更新 ARIA 状态
  var origSetMode = setMode;
  setMode = function(mode) {
    origSetMode(mode);
    document.getElementById('modeOc').setAttribute('aria-pressed', mode==='oc'?'true':'false');
    document.getElementById('modeGeneral').setAttribute('aria-pressed', mode==='general'?'true':'false');
  };

  // 文本输入
  document.querySelectorAll('input[type=text], textarea, select').forEach(function(el){
    el.addEventListener('input', scheduleUpdate);
    el.addEventListener('change', scheduleUpdate);
  });

  // Phase 1: 输入校验反馈
  addInputFeedback(document.getElementById('clubName'), function(v){ return v.trim().length > 0 && v.length <= 50; }, '俱乐部名称不能为空（最多50字符）');
  addInputFeedback(document.getElementById('name'), function(v){ return v.trim().length > 0; }, '名字不能为空');
  addInputFeedback(document.getElementById('fullName'), function(v){ return v.trim().length > 0; }, '姓名不能为空');

  // 自定义颜色
  document.getElementById('customColor').addEventListener('input', function(e){
    AppState.theme = {a:e.target.value, b:lighten(e.target.value), mode: AppState.theme.mode || 'dark'};
    document.querySelectorAll('#themeRow .swatch').forEach(function(x){x.classList.remove('active');});
    scheduleUpdate();
  });

  // Phase 4: 行业预设按钮绑定
  document.querySelectorAll('#industryRow .btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      applyIndustryPreset(btn.getAttribute('data-industry'));
    });
  });

  // 头像上传
  const fileInput = document.getElementById('avatar');
  document.getElementById('avatarBtn').addEventListener('click', function(){ fileInput.click(); });
  fileInput.addEventListener('change', function(e){
    const f = e.target.files && e.target.files[0]; if(!f) return;
    // Phase 1: 文件类型校验
    if (!f.type.startsWith('image/')) {
      alert('请选择图片文件');
      fileInput.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = function(ev){
      const dataURL = ev.target.result;
      const img = new Image();
      img.onload = function(){
        try{
          const maxDim = 512;
          const w = img.naturalWidth, h = img.naturalHeight;
          if(!w || !h) throw new Error('bad image');
          const scale = Math.min(1, maxDim / Math.max(w, h));
          const cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
          const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
          cv.getContext('2d').drawImage(img, 0, 0, cw, ch);
          AppState.avatar = cv.toDataURL('image/jpeg', 0.85);
        }catch(err){ AppState.avatar = dataURL; }
        const thumb = document.getElementById('avatarThumb');
        if(thumb) thumb.src = AppState.avatar;
        scheduleUpdate();
      };
      img.onerror = function(){ AppState.avatar = dataURL; const thumb = document.getElementById('avatarThumb'); if(thumb) thumb.src = AppState.avatar; scheduleUpdate(); };
      img.src = dataURL;
    };
    reader.readAsDataURL(f);
  });
  document.getElementById('avatarClear').addEventListener('click', function(){ AppState.avatar=null; fileInput.value=''; document.getElementById('avatarThumb').removeAttribute('src'); scheduleUpdate(); });

  // 下载卡片
  document.getElementById('download').addEventListener('click', function(){
    const c = readCfg();
    const html = buildDoc(c, {animate:true});
    const blob = new Blob([html], {type:'text/html;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const fname = (c.mode==='oc' ? (c.name||c.title) : c.title) || '介绍卡';
    a.href = url; a.download = '介绍卡-'+fname+'.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  });

  // Footer 模式切换：自定义时显示输入框
  document.getElementById('footMode').addEventListener('change', function(){
    const customInput = document.getElementById('footCustom');
    customInput.style.display = this.value === 'custom' ? '' : 'none';
    scheduleUpdate();
  });

  // 重置按钮
  document.getElementById('reset').addEventListener('click', function(){
    document.querySelectorAll('input[type=text], textarea').forEach(function(el){ if(el.id!=='customColor' && el.id!=='footCustom') el.value = el.defaultValue; });
    document.getElementById('zodiac').selectedIndex = 3;
    document.getElementById('footMode').value = 'default';
    document.getElementById('footCustom').style.display = 'none';
    AppState.theme = {a:'#ff9d5c', b:'#ffd0a8', mode:'dark'};
    document.getElementById('customColor').value = '#ff9d5c';
    AppState.avatar = null; document.getElementById('avatarThumb').removeAttribute('src');
    document.querySelectorAll('#themeRow .swatch').forEach(function(x,i){ x.classList.toggle('active', i===0); });
    setMode('oc');
    loadPreview();
  });

  // 头像默认缩略图
  document.getElementById('avatarThumb').style.background = 'linear-gradient(160deg,#ffd0a8,#ff9d5c)';

  // 启动预览
  preview.addEventListener('load', function(){ updatePreview(); });
  // 无论是否有恢复状态，都先加载预览（确保 iframe 有内容）
  loadPreview();
}

// 启动应用
setup();

/* ============================================================
   SECTION 11: 全局 API（Phase 3 - 插件钩子）
   职责：暴露可扩展接口，供未来插件或自定义模板使用
   ============================================================ */
window.XYIntroCard = {
  registerTemplate: registerTemplate,
  addTheme: function(name, config) {
    // 支持旧签名 (name, a, b) 和新签名 (name, config)
    var theme;
    if (typeof config === 'string' || typeof config === 'number') {
      // 旧签名：addTheme(name, a, b)
      theme = { name: name, a: arguments[1], b: arguments[2] || lighten(arguments[1]) };
    } else {
      // 新签名：addTheme(name, config)
      theme = Object.assign({ mode: 'dark', palette: null }, config);
      theme.name = name;
    }
    THEMES_CONFIG[name] = theme;
    THEMES.push(theme);
    buildThemeSwatches(); // 重新渲染色块
  },
  onCardExport: [],
  version: '2.1.0-Phase4',
  FEATURES: Features
};
</script>
