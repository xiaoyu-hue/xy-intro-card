<!DOCTYPE html>
<html lang='zh-CN'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'>
<meta name='theme-color' content='#f7f4f0'>
<meta http-equiv='Content-Security-Policy' content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-ancestors 'none'"><title>林小雨</title>
<link rel='icon' href='data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Cdefs%3E%3ClinearGradient%20id%3D'g'%20x1%3D'0'%20y1%3D'0'%20x2%3D'0'%20y2%3D'1'%3E%3Cstop%20offset%3D'0'%20stop-color%3D'%238a9dad'%2F%3E%3Cstop%20offset%3D'1'%20stop-color%3D'%235a6b7c'%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D'64'%20height%3D'64'%20rx%3D'16'%20fill%3D'%23f7f4f0'%2F%3E%3Ctext%20x%3D'32'%20y%3D'46'%20font-family%3D'serif'%20font-size%3D'38'%20font-weight%3D'700'%20text-anchor%3D'middle'%20fill%3D'url(%23g)'%3E%E6%9E%97%3C%2Ftext%3E%3C%2Fsvg%3E'>
<style>

  :root{
    --bg:#06060b;
    --glass-1:rgba(255,255,255,0.13);
    --glass-2:rgba(255,255,255,0.045);
    --line:rgba(255,255,255,0.17);
    --amber:#ff9d5c;
    --amber-2:#ffd0a8;
    --text:#f6f3ee;
    --dim:rgba(246,243,238,0.56);
    --cn:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
    --en:"Snell Roundhand","Apple Chancery","Brush Script MT","Segoe Script","Comic Sans MS",cursive;
    --blur:26px;
    --card-w:420px;
    --blob1:rgba(255,138,76,.48);
    --blob2:rgba(96,120,255,.38);
    --blob3:rgba(188,90,224,.30);
    --name-gradient-start:#ffffff;
    --name-shine-color:rgba(255,255,255,0.95);
    /* Phase 4: 商务主题扩展变量（暗色默认 = 现有硬编码值，light 主题由 themeVars 覆盖） */
    --bg-solid:#06060b;
    --bg-grad-top:#171425;
    --card-shadow-1:rgba(0,0,0,0.78);
    --card-shadow-2:rgba(0,0,0,0.42);
    --card-highlight:rgba(255,255,255,0.20);
    --card-edge:rgba(255,255,255,0.35);
    --card-border-inset-1:rgba(255,255,255,0.40);
    --card-border-inset-2:rgba(255,255,255,0.05);
    --chip-bg:rgba(255,255,255,0.05);
    --chip-line:rgba(255,255,255,0.12);
    --pill-bg1:rgba(255,255,255,0.12);
    --pill-bg2:rgba(255,255,255,0.04);
    --pill-border:rgba(255,255,255,0.18);
    --pill-inset:rgba(255,255,255,0.25);
    --sign-color:#fffaf3;
    --foot-color:rgba(246,243,238,0.3);
    --text-selection:#fff;
    --fallback-bg1:rgba(30,28,40,0.95);
    --fallback-bg2:rgba(14,13,20,0.97);
    --avatar-rect:#0b0a12;
    --avatar-border:rgba(255,255,255,0.25);
    --avatar-shadow:rgba(0,0,0,0.45);
    --avatar-gradient-stop3:#6a4630;
    --name-shine-stop:rgba(255,255,255,0.95);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  ::selection{ background:rgba(var(--amber-rgb),0.38); color:var(--text-selection); }
  ::-moz-selection{ background:rgba(var(--amber-rgb),0.38); color:var(--text-selection); }

  body{
    min-height:100vh; min-height:100dvh;
    font-family:var(--cn); color:var(--text); background:var(--bg-solid);
    background:radial-gradient(120% 90% at 50% -10%, var(--bg-grad-top) 0%, var(--bg-solid) 58%) fixed;
    overflow-x:hidden;
    -webkit-text-size-adjust:100%; text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    position:relative; width:100%; min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    padding:24px 16px;
    padding-top:calc(24px + env(safe-area-inset-top, 0px));
    padding-right:calc(16px + env(safe-area-inset-right, 0px));
    padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px));
    padding-left:calc(16px + env(safe-area-inset-left, 0px));
  }

  .grain{
    position:fixed; inset:0; z-index:2; pointer-events:none;
    opacity:0.035; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .blob{
    position:fixed; border-radius:50%; z-index:0; pointer-events:none;
    animation:drift 22s ease-in-out infinite; will-change:transform;
  }
  .blob.b1{ width:560px;height:560px; background:radial-gradient(circle, var(--blob1) 0%, rgba(255,138,76,0) 70%); top:-160px; left:-140px; }
  .blob.b2{ width:520px;height:520px; background:radial-gradient(circle, var(--blob2) 0%, rgba(96,120,255,0) 70%); bottom:-180px; right:-140px; animation-delay:-7s; }
  .blob.b3{ width:440px;height:440px; background:radial-gradient(circle, var(--blob3) 0%, rgba(188,90,224,0) 70%); top:36%; left:52%; animation-delay:-12s; }
  @keyframes drift{
    0%,100%{ transform:translate(0,0) scale(1); }
    33%{ transform:translate(34px,-26px) scale(1.06); }
    66%{ transform:translate(-24px,20px) scale(0.95); }
  }

  .card{
    position:relative; z-index:1; width:100%; max-width:var(--card-w);
    padding:40px 30px 34px; border-radius:32px; text-align:center; transition:transform .35s ease;
  }
  .card::before{
    content:""; position:absolute; inset:0; z-index:1; border-radius:inherit;
    background:radial-gradient(70% 50% at var(--mx,50%) var(--my,0%),
      var(--card-highlight), rgba(255,255,255,0) 62%);
    pointer-events:none;
  }
  .card::after{
    content:""; position:absolute; left:8%; right:8%; bottom:-2px; height:1px; z-index:1;
    background:linear-gradient(90deg, transparent, var(--card-edge), transparent);
    pointer-events:none;
  }
  .card > *{ position:relative; z-index:2; }

  .card-bg{
    position:absolute; inset:0; z-index:0; border-radius:inherit;
    background:linear-gradient(160deg, var(--glass-1), var(--glass-2));
    border:1px solid var(--line);
    -webkit-backdrop-filter:blur(var(--blur)) saturate(170%);
    backdrop-filter:blur(var(--blur)) saturate(170%);
    box-shadow:
      0 30px 70px -25px rgba(0,0,0,0.78),
      0 4px 14px rgba(0,0,0,0.42),
      inset 0 1px 1px rgba(255,255,255,0.40),
      inset 0 -1px 1px rgba(255,255,255,0.05);
    pointer-events:none; transition:box-shadow .35s ease;
  }

  .avatar-wrap{ position:relative; z-index:2; width:138px; height:138px; margin:0 auto 20px; border-radius:50%; }
  .avatar-wrap::after{ content:""; position:absolute; inset:-14px; border-radius:50%; z-index:0;
    background:radial-gradient(circle, rgba(var(--amber-rgb),.34), transparent 70%); }
  .avatar-ring{
    position:absolute; inset:-7px; border-radius:50%; z-index:3;
    border:2px solid rgba(var(--amber-2-rgb),0.55); box-shadow:0 0 14px rgba(var(--amber-rgb),0.25);
    animation:breathe 4.6s ease-in-out infinite;
  }
  @keyframes breathe{ 0%,100%{ transform:scale(1); opacity:.55; } 50%{ transform:scale(1.06); opacity:1; } }
  .avatar{
    position:relative; z-index:2; width:100%; height:100%; border-radius:50%; object-fit:cover; display:block;
    background:radial-gradient(circle at 50% 32%, var(--amber-2) 0%, var(--amber) 42%, var(--avatar-gradient-stop3) 100%);
    border:1px solid var(--avatar-border); box-shadow:0 10px 26px var(--avatar-shadow);
    transform:translateZ(0); backface-visibility:hidden; -webkit-backface-visibility:hidden;
    animation:floaty 6.8s ease-in-out infinite;
  }
  @keyframes floaty{ 0%,100%{ transform:translate3d(0,0,0); } 50%{ transform:translate3d(0,-6px,0); } }

  .club-name{
    position:relative; font-size:32px; font-size:clamp(24px, 7.2vw, 34px);
    font-weight:700; letter-spacing:3px; line-height:1.25;
    background:linear-gradient(180deg, var(--name-gradient-start), var(--amber-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 10px rgba(var(--amber-rgb),0.35));
  }
  .club-name::after{
    content:attr(data-text); position:absolute; left:0; top:0; width:100%;
    background:linear-gradient(100deg, transparent 40%, var(--name-shine-color) 50%, transparent 60%);
    background-size:260% 100%; background-repeat:no-repeat;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shine 6.5s ease-in-out infinite; pointer-events:none;
  }
  @keyframes shine{ 0%, 40%{ background-position:-130% 0; } 72%, 100%{ background-position:230% 0; } }
  .script{
    font-family:var(--en); font-size:23px; font-size:clamp(16px, 5.0vw, 24px);
    line-height:1.45; color:var(--amber-2); margin-top:2px; letter-spacing:.5px;
  }

  .divider{ width:64px; height:1px; margin:22px auto; background:linear-gradient(90deg, transparent, rgba(var(--amber-2-rgb),.9), transparent); position:relative; }
  .divider::after{ content:""; position:absolute; top:-1.5px; left:50%; transform:translateX(-50%); width:5px; height:4px; border-radius:50%; background:var(--amber-2); box-shadow:0 0 10px 2px rgba(var(--amber-2-rgb),.7); }

  .info{ font-size:17px; font-size:clamp(15px, 4.3vw, 18px); letter-spacing:3px; color:var(--text); }
  .info .dot{ color:var(--amber); margin:0 8px; }
  .info .age{ color:var(--amber-2); }
  .info .zodiac{
    display:inline-block; margin-left:5px; letter-spacing:0;
    font-family:"Apple Symbols","Segoe UI Symbol","Noto Sans Symbols","Noto Sans Symbols2","Symbola",serif;
    font-size:1.12em; color:var(--amber-2);
    text-shadow:0 0 10px rgba(var(--amber-2-rgb),0.45); animation:zodiacGlow 4.2s ease-in-out infinite;
  }
  @keyframes zodiacGlow{ 0%,100%{ opacity:.72; } 50%{ opacity:1; } }

  .label{
    display:inline-block; font-size:11px; font-size:clamp(9px, 2.9vw, 11px); letter-spacing:5px; color:var(--dim);
    padding:5px 14px; margin:24px 0 13px; border-radius:999px;
    background:var(--chip-bg); border:1px solid var(--chip-line);
  }

  .skills{ display:flex; flex-wrap:wrap; justify-content:center; margin:0 -5px; }
  .skill{
    position:relative; isolation:isolate; margin:0 5px 10px; padding:10px 16px; border-radius:16px;
    font-size:14px; font-size:clamp(12px, 3.7vw, 15px); letter-spacing:1px; color:var(--text);
    background:linear-gradient(150deg, var(--pill-bg1), var(--pill-bg2));
    border:1px solid var(--pill-border); box-shadow:inset 0 1px 1px var(--pill-inset);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    transition:transform .22s cubic-bezier(.34,1.56,.64,1), background .25s ease;
  }
  .skill::before{
    content:""; position:absolute; inset:-3px; z-index:-1; border-radius:inherit;
    background:radial-gradient(65% 82% at 50% 112%, rgba(var(--amber-rgb),0.8), transparent 72%);
    opacity:0; pointer-events:none; animation:pillGlow 3.8s ease-in-out infinite; will-change:opacity;
  }
  .skill:nth-child(1)::before{ animation-delay:0s; }
  .skill:nth-child(2)::before{ animation-delay:1.25s; }
  .skill:nth-child(3)::before{ animation-delay:2.5s; }
  @keyframes pillGlow{ 0%,100%{ opacity:0; } 50%{ opacity:1; } }

  @media (hover:hover) and (pointer:fine){
    .skill:hover{ transform:translateY(-4px); background:rgba(var(--amber-rgb),0.18); }
    .card:hover .card-bg{ box-shadow:0 36px 80px -28px var(--card-shadow-1), 0 4px 14px var(--card-shadow-2),
      inset 0 1px 1px var(--card-border-inset-1), inset 0 -1px 1px var(--card-border-inset-2); }
  }
  .skill:active{ transform:scale(.93); background:rgba(var(--amber-rgb),0.16); }

  .sign{
    position:relative; margin-top:36px; padding:16px 14px 14px;
    font-size:17px; font-size:clamp(15px, 4.4vw, 18px); line-height:1.85; letter-spacing:1.5px;
    color:var(--sign-color); text-shadow:0 0 14px rgba(var(--amber-2-rgb),0.18);
  }
  .sign::before{ content:""; position:absolute; top:0; left:50%; transform:translateX(-50%); width:60%; height:1px;
    background:linear-gradient(90deg, transparent, rgba(var(--amber-2-rgb),.5), transparent); }
  .sign .script{ display:block; margin-top:8px; font-size:19px; font-size:clamp(15px, 4.6vw, 20px); line-height:1.55; letter-spacing:0; color:var(--amber-2); animation:glow 4.8s ease-in-out infinite; }
  @keyframes glow{ 0%,100%{ text-shadow:0 0 8px rgba(var(--amber-2-rgb),0.18); } 50%{ text-shadow:0 0 20px rgba(var(--amber-2-rgb),0.55); } }

  .reveal{ opacity:0; transform:translateY(16px); animation:rise 1s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:calc(.05s + var(--i, 0) * .135s); }
  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }
  .avatar-wrap{ --i:0; }
  .club-name{ --i:1; }
  .card > .script{ --i:2; }
  .divider{ --i:3; }
  .label-info{ --i:4; }
  .info{ --i:5; }
  .label-skill{ --i:6; }
  .skills{ --i:7; }
  .sign{ --i:8; }

  .foot{ margin-top:18px; text-align:center; font-size:11px; font-size:clamp(9px, 2.8vw, 11px); color:var(--foot-color); z-index:1;
    padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px); }

  .particles{ position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .particle{ position:absolute; bottom:-14px; border-radius:50%; background:radial-gradient(circle, rgba(var(--amber-2-rgb),0.85), rgba(var(--amber-rgb),0)); animation:riseP linear infinite; }
  @keyframes riseP{
    0%{ transform:translate3d(0,0,0) scale(1); opacity:0; }
    12%{ opacity:.75; }
    40%{ transform:translate3d(16px,-46vh,0) scale(.78); }
    70%{ transform:translate3d(-12px,-80vh,0) scale(.55); }
    88%{ opacity:.35; }
    100%{ transform:translate3d(8px,-112vh,0) scale(.35); opacity:0; }
  }

  @media (max-width:480px){
    :root{ --blur:18px; --card-w:100%; }
    .stage{ padding:18px 14px; padding-top:calc(18px + env(safe-area-inset-top, 0px)); padding-right:calc(14px + env(safe-area-inset-right, 0px)); padding-bottom:calc(18px + env(safe-area-inset-bottom, 0px)); padding-left:calc(14px + env(safe-area-inset-left, 0px)); }
    .card{ padding:32px 20px 28px; border-radius:26px; }
    .avatar-wrap{ width:120px; height:120px; margin-bottom:18px; }
    .club-name{ letter-spacing:2px; }
    .info{ letter-spacing:2px; }
    .label{ letter-spacing:4px; padding:5px 12px; margin:20px 0 11px; }
    .skill{ padding:9px 14px; }
    .sign{ margin-top:28px; padding:14px 10px 12px; }
    .grain{ display:none; }
    .blob{ opacity:.72; animation-duration:30s; }
    .avatar{ animation-duration:9s; }
    .avatar-ring{ animation-duration:6s; }
    .skill::before{ animation-duration:5.2s; }
    .sign .script{ animation-duration:7s; }
    .particle{ opacity:.65; }
    .skill{ -webkit-backdrop-filter:none; backdrop-filter:none; background:linear-gradient(150deg, rgba(255,255,255,0.17), rgba(255,255,255,0.07)); }
    .card::before{ background:radial-gradient(52% 40% at 50% 50%, var(--card-highlight), rgba(255,255,255,0) 68%); animation:sheenMove 11s ease-in-out infinite alternate; }
    @keyframes sheenMove{ 0%{ transform:translate(-20%, -7%); } 100%{ transform:translate(20%, 10%); } }
  }
  @media (max-width:414px){ .card{ padding:28px 18px 26px; } .avatar-wrap{ width:112px; height:112px; } .divider{ margin:18px auto; } }
  @media (max-width:480px) and (max-height:720px){ .card{ padding:24px 18px 22px; } .avatar-wrap{ width:104px; height:104px; margin-bottom:14px; } .divider{ margin:13px auto; } .label{ margin:13px 0 8px; } .skill{ margin-bottom:8px; } .sign{ margin-top:18px; padding:11px 10px 9px; } .foot{ margin-top:12px; } }
  @media (max-width:360px){ .card{ padding:26px 16px 24px; border-radius:24px; } .avatar-wrap{ width:104px; height:104px; margin-bottom:16px; } .info .dot{ margin:0 6px; } .skill{ padding:8px 12px; margin:0 4px 9px; } .sign{ margin-top:22px; } }
  @media (max-width:320px){ .card{ padding:22px 12px 20px; border-radius:20px; } .avatar-wrap{ width:92px; height:92px; } .label{ padding:4px 10px; margin:16px 0 9px; } .skills{ margin:0 -3px; } .skill{ margin:0 3px 8px; padding:8px 11px; } .divider{ margin:14px auto; } }
  @media (orientation:landscape) and (max-height:560px){ .stage{ padding:12px 16px; } .card{ padding:20px 26px; border-radius:22px; max-width:540px; } .avatar-wrap{ width:76px; height:76px; margin-bottom:12px; } .divider{ margin:12px auto; } .label{ margin:12px 0 8px; } .skills{ margin:0 -4px; } .skill{ margin:0 4px 8px; padding:7px 13px; } .sign{ margin-top:16px; } .foot{ margin-top:12px; } }
  @media (min-width:768px){ :root{ --card-w:440px; } .card{ padding:44px 34px 38px; border-radius:34px; } .avatar-wrap{ width:146px; height:146px; } }
  /* Phase 3: 折叠屏适配 */
  @media (min-width:768px) and (max-width:1100px) and (orientation:portrait){
    :root{ --card-w:360px; }
  }
  /* Phase 3: 超宽屏适配 */
  @media (min-width:1400px){
    .wrap{ justify-content: center; }
    .panel.preview{ max-width: 500px; }
  }
  /* Phase 3: 容器查询（配合 iframe 内嵌场景） */
  @container (max-width: 480px) {
    .card { padding: 28px 20px; }
    .avatar-wrap { width: 112px; height: 112px; }
  }
  @container (max-width: 360px) {
    .card { padding: 24px 16px; }
  }

  @supports not ((backdrop-filter:blur(4px)) or (-webkit-backdrop-filter:blur(4px))){
    .card-bg{ background:linear-gradient(160deg, var(--fallback-bg1), var(--fallback-bg2)); }
    .skill{ background:var(--pill-bg1); }
    /* 旧浏览器禁用粒子系统 */
    .particles{ display: none !important; }
    .blob{ opacity: 0.25; }
  }
  /* Phase 2: iOS < 15 特殊兼容 */
  @supports (-webkit-touch-callout: none) {
    .card-bg { -webkit-backdrop-filter: blur(20px) saturate(150%); }
  }

  .ripple-layer{ position:absolute; inset:0; z-index:6; border-radius:inherit; overflow:hidden; pointer-events:none; }
  .ripple{ position:absolute; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(255,255,255,0.5) 0%, rgba(var(--amber-2-rgb),0.20) 42%, transparent 70%);
    transform:scale(0); opacity:.6; animation:rippleOut .9s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes rippleOut{ to{ transform:scale(2.6); opacity:0; } }

  .lite .particles{ display:none; }
  .lite .card-bg{ -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
  .lite .blob{ animation-duration:40s; }
  .lite .skill::before{ animation-duration:6s; }
  .lite .avatar{ animation:none; }
  .lite .club-name::after{ animation-duration:9s; }
  .paused *{ animation-play-state:paused !important; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; } .reveal{ opacity:1; transform:none; } }
  /* Phase 1: 高对比度模式适配 */
  @media (forced-colors: active) {
    .card-bg{ border: 2px solid ButtonText; background: Canvas !important; }
    .skill{ border: 1px solid ButtonText; background: Canvas !important; }
    .blob, .particles{ display: none !important; }
    .club-name{ -webkit-text-fill-color: CanvasText; background: none; color: CanvasText; }
  }

<script>
(function(){
  var stage = document.getElementById('stage');
  var card = document.getElementById('card');
  if(!card) return;
  var fine=false; try{ fine = window.matchMedia('(hover:hover) and (pointer:fine)').matches; }catch(e){}
  if(fine){
    var tx=50,ty=0,px=50,py=0,raf=null;
    function frame(){ px+=(tx-px)*0.12; py+=(ty-py)*0.12; card.style.setProperty('--mx',px.toFixed(2)+'%'); card.style.setProperty('--my',py.toFixed(2)+'%'); if(Math.abs(tx-px)>0.05||Math.abs(ty-py)>0.05){raf=requestAnimationFrame(frame);}else{raf=null;} }
    function start(){ if(raf===null) raf=requestAnimationFrame(frame); }
    card.addEventListener('mousemove',function(e){ var r=card.getBoundingClientRect(); tx=((e.clientX-r.left)/r.width)*100; ty=((e.clientY-r.top)/r.height)*100; start(); },{passive:true});
    card.addEventListener('mouseleave',function(){ tx=50;ty=0;start(); });
  }
  // Phase 2: IntersectionObserver 入场动画
  try {
    if ('IntersectionObserver' in window && card) {
      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.style.animationPlayState = 'running';
            observer.disconnect();
          }
        });
      }, { threshold: 0.1 });
      observer.observe(card);
    }
  } catch(e) {}
  try{ if(window.innerWidth>480 && !('ontouchstart' in window)){ var g=document.createElement('div'); g.className='grain'; stage.appendChild(g); } }catch(e){}
  var small = (stage.clientWidth||window.innerWidth) <= 480;
  var cores = navigator.hardwareConcurrency||4; var weak = cores<=4;
  var count = small ? (weak?5:9) : (weak?12:20);
  var layer=document.createElement('div'); layer.className='particles'; stage.insertBefore(layer, stage.firstChild);
  // Phase 2: requestIdleCallback 降级
  var scheduleInit = window.requestIdleCallback || function(cb){ return setTimeout(cb, 100); };
  scheduleInit(function(){
    for(var i=0;i<count;i++){ var p=document.createElement('span'); p.className='particle'; var size=Math.random()*5+3; p.style.width=size+'px'; p.style.height=size+'px'; p.style.left=(Math.random()*100)+'%'; var dur=small?(Math.random()*10+15):(Math.random()*8+8); p.style.animationDuration=dur+'s'; p.style.animationDelay=(-Math.random()*20)+'s'; layer.appendChild(p); }
  });
  var ripples=document.getElementById('ripples');
  if(ripples){ var downEv=('onpointerdown' in window)?'pointerdown':(('ontouchstart' in window)?'touchstart':'mousedown'); function point(e){ if(e.touches&&e.touches[0]) return {x:e.touches[0].clientX,y:e.touches[0].clientY}; if(e.clientX!==undefined) return {x:e.clientX,y:e.clientY}; return null; } card.addEventListener(downEv,function(e){ var p=point(e); if(!p||ripples.childElementCount>5) return; var r=card.getBoundingClientRect(); var size=Math.max(r.width,r.height)*0.9; var s=document.createElement('span'); s.className='ripple'; s.style.width=s.style.height=size+'px'; s.style.left=(p.x-r.left-size/2)+'px'; s.style.top=(p.y-r.top-size/2)+'px'; ripples.appendChild(s); setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); },950); },{passive:true}); }
  var frames=0,t0=0,aborted=false,judged=false;
  function tick(ts){ if(document.visibilityState && document.visibilityState!=='visible'){ aborted=true; return; } if(!t0) t0=ts; frames++; var el=ts-t0; if(el<2500){ requestAnimationFrame(tick); return; } if(!aborted&&!judged){ judged=true; var fps=frames/(el/1000); if(fps<45){ try{ stage.classList.add('lite'); }catch(err){} } } }
  requestAnimationFrame(tick);
  document.addEventListener('visibilitychange',function(){ try{ if(document.hidden) document.documentElement.classList.add('paused'); else document.documentElement.classList.remove('paused'); }catch(e){} });
})();
</script>
